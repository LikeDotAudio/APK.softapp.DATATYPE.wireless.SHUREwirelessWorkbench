# WHAT THIS AGENT IS, compiled into apk-worker-wireless-wwb by `manifest = "agent.toml"` in
# src/bin/apk-worker-wireless-wwb.rs (apkaudio_contracts::embedded_manifest!, ROAD-3472). Not
# read at run time: the image carries the binary, not this file.

[agent]
name = "wireless_wwb"
kind = "worker"
title = "Shure Wireless Workbench importer"
status = "live"
summary = "Answers outgoing/job with incoming/result: parses a Wireless Workbench show file sent as a job and returns its records under the job's own job_id."

[telemetry]
# GET /status and GET /telemetry on 127.0.0.1:8228 — `running` until the first
# job is taken, `serving` after (a packet is one job the job lane actually
# runs; a job refused `busy` is not counted). The container is bridge-networked,
# so NODE.BareMetal reads the same counters off the incoming/telemetry tick.
# APK_TELEMETRY_PORT moves it; 0 turns it off.
port = 8228

[config]
# Every key of config.ini's [wireless_wwb] that code reads: raise and enabled by
# apk-plugin-runner (module_raise, module_enabled), max_job_bytes by
# src/lib.rs max_job_bytes. A key added there and not here is counted in
# `unread_config_keys`.
reads = ["raise", "enabled", "max_job_bytes"]
