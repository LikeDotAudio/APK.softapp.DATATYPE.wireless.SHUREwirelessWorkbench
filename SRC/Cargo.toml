# apk-worker-wireless-wwb — the Shure Wireless Workbench show importer as a worker on the bus
# (LOOSE-workers-convert-rest, after PLAN-3423.01's wireless CSV worker).
#
# Owns: the container entry point that answers `outgoing/job` with
# `incoming/result` by running the parser crate beside it (`importer/`,
# apkaudio-wireless-wwb). The job loop is the runner's
# (`apk_plugin_runner::jobs::JobWorker`); the envelope — job_id, text |
# content_b64, size limit, the versioned answer — is the wireless kernel's
# (apkaudio-wireless-kernel, DATATYPE.wireless.CSV/SRC/kernel, feature `worker`).
#
# BUILT ON apk-plugin-runner, the crate every THICK plugin links: it publishes
# the config, the last will, the self-test door and the retained `incoming/api`
# description; this crate adds only the job loop.
#
# ITS OWN WORKSPACE, not a member of DISCOVERY.Engine's: a worker builds its
# own image, so a broken worker never fails the plugin build and the reverse.
#
# THE SDK BY TAG, like every THICK plugin: runner and contracts come from
# APK.plugin.SDK by tag (`sdk-v0.7`; jobs arrived in `sdk-v0.6`), the wireless kernel from DATATYPE.wireless.CSV by its pushed rev.
# This crate builds from its own repository: Cargo.lock records those git
# sources, and the image builds from `SRC/` alone. To build against a local
# checkout of the runner instead, add a git-excluded `.cargo/config.toml` with
# a [patch] (the plugin_standalone.py shape) — and do not commit the lock it writes.
[package]
name = "apk-worker-wireless-wwb"
version = "0.2.0"
edition = "2024"

[workspace]

[lib]
name = "apk_worker_wireless_wwb"
path = "src/lib.rs"

[dependencies]
apk-plugin-runner = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.7" }
apkaudio-contracts = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.7" }
apkaudio-wireless-wwb = { path = "importer" }
apkaudio-wireless-kernel = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.CSV", rev = "646e960e42ec13f2c39e4100a9019da9e4f632f6", features = ["worker"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
# builds a zipped .shw in a test
zip = "0.6"

[[bin]]
name = "apk-worker-wireless-wwb"
path = "src/bin/apk-worker-wireless-wwb.rs"

# The compose healthcheck: one line over `apk_plugin_runner::health_check()`,
# the runner's probe as a function (no other repository's file compiled here).
[[bin]]
name = "apk-plugin-health"
path = "src/bin/apk-plugin-health.rs"
