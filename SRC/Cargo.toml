# apk-worker-wireless-wwb — the Shure Wireless Workbench show importer as a worker on the bus
# (LOOSE-workers-convert-rest, after PLAN-3423.01's wireless CSV worker).
#
# Owns: the container entry point that answers `outgoing/job` with
# `incoming/result` by running the parser crate beside it (`importer/`,
# apkaudio-wireless-wwb). The job loop is the runner's
# (`apk_plugin_runner::jobs::JobWorker`); the envelope — job_id, text |
# content_b64, size limit, the versioned answer — is the wireless kernel's
# (apkaudio-wireless-kernel, DATATYPE.wireless.CSV/SRC/kernel, feature `worker`).
#
# BUILT ON apk-plugin-runner, the crate every THICK plugin links: it publishes
# the config, the last will, the self-test door and the retained `incoming/api`
# description; this crate adds only the job loop.
#
# ITS OWN WORKSPACE, not a member of DISCOVERY.Engine's: a worker builds its
# own image, so a broken worker never fails the plugin build and the reverse.
#
# THE SDK BY TAG, like every THICK plugin (2026-10-30 audit): runner and
# contracts come from APK.plugin.SDK `sdk-v0.5`, the kernel from
# DATATYPE.wireless.CSV by rev. In the monorepo, `.cargo/config.toml` beside
# this file (kept out of git by .git/info/exclude) patches all three back to
# the checkout, and the Dockerfile passes the same entries as `--config`, so no
# build fetches GitHub. A standalone clone builds once the next SDK tag
# carries `apk_plugin_runner::jobs` (publishing a tag is the owner's).
[package]
name = "apk-worker-wireless-wwb"
version = "0.2.0"
edition = "2024"

[workspace]

[lib]
name = "apk_worker_wireless_wwb"
path = "src/lib.rs"

[dependencies]
apk-plugin-runner = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.5" }
apkaudio-contracts = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.5" }
apkaudio-wireless-wwb = { path = "importer" }
apkaudio-wireless-kernel = { git = "https://github.com/LikeDotAudio/APK.softapp.DATATYPE.wireless.CSV", rev = "28c0554e2704022817ebd51aa46a9d4002c0f16b", features = ["worker"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
# builds a zipped .shw in a test
zip = "0.6"

[[bin]]
name = "apk-worker-wireless-wwb"
path = "src/bin/apk-worker-wireless-wwb.rs"

# The runner's health probe, compiled from the runner's own source file —
# until the runner exposes it as a function (handoff to DISCOVERY.Engine).
[[bin]]
name = "apk-plugin-health"
path = "../../../../../POD.THICK/DISCOVERY.Engine/SRC/RUNNER/src/bin/apk-plugin-health.rs"
