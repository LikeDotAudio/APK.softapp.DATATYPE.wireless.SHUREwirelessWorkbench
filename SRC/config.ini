# WIRELESS_WWB — the Shure Wireless Workbench .shw show importer as a worker.
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/wireless_wwb/config
[wireless_wwb]
# How this is raised (contracts/DISCOVERY-LIFECYCLE.md, stage 2): compose = up for as
# long as its stack is up; the discovery engine does not supervise it.
raise = compose
enabled = true
# A job arrives on APK.audio/System/Protocols/wireless_wwb/outgoing/job (not
# retained) as JSON: {"job_id": "...", "filename": "venue.shw", "content_b64": "..."}
# ("content_b64" is the file's bytes: a zipped .shw survives only that way;
# a plain-XML show may come as "text" instead). The answer goes to
# APK.audio/System/Protocols/wireless_wwb/incoming/result (not retained),
# carrying the same job_id.
# A job whose show is larger than this many bytes (decoded) is answered with
# an error rather than parsed. A plain-XML show is big: the fixture
# test_data/venue.shw is 1.6 MB for 186 channels, so 16 MiB leaves room for a
# festival-sized show.
max_job_bytes = 16777216
# Every carrier an imported file names is said under
# APK.audio/System/Protocols/wireless_wwb/Device/<id>/<leaf> (ROAD-3519,
# src/carriers.rs): unkept, again every restate_s seconds, and sighted for
# presence at APK.audio/Discovery/wireless_wwb/<deviceId>. A file's carriers last
# until the same file is imported again or the worker restarts.
restate_s = 30
# Presence is the runner's: these two keys start its tracker. A carrier not
# restated for this long (a restarted worker forgets its imports) is offline.
presence_protocols = wireless_wwb
presence_inactive_after_s = 90
